# Releases: al subir una etiqueta vX.Y.Z (solo cifras: las únicas versiones;
# ver deploy/linux/actualizar-release.sh), compila el panel para Linux
# x86_64 y aarch64 (empaquetados con tools/empaquetar-release.sh) y para
# FreeBSD x86_64 (con cross, empaquetado con
# deploy/cross/empaquetar-freebsd.sh), y los publica con SHA256SUMS en la
# release de la etiqueta, que pasa a ser la última (latest). Es lo que
# descargan los actualizadores, con <base> = <repo>/releases:
#   <base>/latest/download/SHA256SUMS
#   <base>/download/<versión>/routerpanel-<versión>-<objetivo>.tar.gz
#
# Atestaciones de procedencia (SLSA, firmadas con Sigstore) de cada archivo:
# el actualizador de FreeBSD (deploy/freebsd-jail/actualizar.sh) no instala
# nada de aquí sin comprobar con «gh attestation verify» que viene de este
# repositorio, de la etiqueta y de este flujo (release.yml).
#
# Firma opcional: si el repositorio tiene el secreto MINISIGN_CLAVE_SECRETA
# (el contenido de una clave secreta de minisign sin contraseña, de
# `minisign -G -W`), firma SHA256SUMS en SHA256SUMS.minisig; si no, no firma.
#
# Se compila en Ubuntu 22.04 (x86_64 y arm64): los binarios piden glibc 2.35
# o posterior, así que valen para Debian 12, Ubuntu 22.04 y Raspberry Pi OS
# de 64 bits (bookworm) en adelante.
#
# FreeBSD se compila con cross, como en el PC de compilación (deploy/cross/):
# un contenedor con el enlazador y la libc de FreeBSD; la web la hace
# cargo-leptos igual que en Linux. El archivo es el que acepta el buzón del
# servidor, con COMMIT (el commit de la etiqueta) dentro.
#
# Forgejo Actions también lee esta carpeta, pero la publicación usa gh y la
# API de GitHub.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.etiqueta.outputs.version }}
    steps:
      - name: La etiqueta es vX.Y.Z
        id: etiqueta
        env:
          TIPO: ${{ github.ref_type }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          if [ "$TIPO" != tag ] || ! printf '%s\n' "$ETIQUETA" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::solo se publican etiquetas vX.Y.Z (cifras, sin sufijo)"
            exit 1
          fi
          echo "version=$ETIQUETA" >>"$GITHUB_OUTPUT"

  compilar:
    needs: version
    strategy:
      matrix:
        include:
          - objetivo: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            # sha256 de rustup-init 1.29.0 (static.rust-lang.org)
            rustup_sha256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
          - objetivo: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            rustup_sha256: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OBJETIVO: ${{ matrix.objetivo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Si el runner no trae rustup, rustup-init de una versión fija, con su
      # sha256 comprobado antes de ejecutarlo (nada de curl | sh).
      - name: rustup (si el runner no lo trae)
        env:
          RUSTUP_VERSION: "1.29.0"
          RUSTUP_SHA256: ${{ matrix.rustup_sha256 }}
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            init="$RUNNER_TEMP/rustup-init"
            curl --proto '=https' --tlsv1.2 -fsSL -o "$init" \
              "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$OBJETIVO/rustup-init"
            echo "$RUSTUP_SHA256  $init" | sha256sum -c -
            chmod 755 "$init"
            "$init" -y --no-modify-path --default-toolchain none
            rm -f "$init"
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          fi
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: El equipo compila para el objetivo
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$OBJETIVO" ]; then
            echo "::error::el runner es $host, no $OBJETIVO"
            exit 1
          fi
      - name: Instalar cargo-leptos
        run: cargo install --locked cargo-leptos@0.3.11
      # --precompress: el panel sirve el wasm, el JS y el CSS ya comprimidos.
      - name: Compilar
        run: cargo leptos build --release --precompress
      - name: Empaquetar
        run: tools/empaquetar-release.sh "$VERSION" "$OBJETIVO" target/release/panel target/site dist
      # El mismo empaquetado, desplegado con actualizar-release.sh desde un
      # servidor local y arrancado: el archivo y el actualizador casan.
      - name: Probar el archivo con el actualizador
        run: deploy/pruebas/release-local.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routerpanel-${{ matrix.objetivo }}
          path: dist/routerpanel-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  freebsd:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OBJETIVO: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml) y objetivo de FreeBSD
        run: |
          rustup toolchain install
          rustup target add "$OBJETIVO"
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cross@0.2.5
      # La misma versión que el PC de compilación (CARGO_LEPTOS_VERSION).
      - name: Instalar cargo-leptos
        run: |
          v=$(sed -n 's/^CARGO_LEPTOS_VERSION=//p' deploy/cross/compilar-freebsd.sh | head -n 1)
          test -n "$v"
          cargo install --locked cargo-leptos --version "$v"
      - name: Compilar (cross)
        env:
          LEPTOS_BIN_TARGET_TRIPLE: x86_64-unknown-freebsd
          LEPTOS_BIN_CARGO_COMMAND: cross
        run: cargo leptos build --release --precompress
      # Con el objetivo de FreeBSD, cargo-leptos deja hash.txt junto a la
      # carpeta del binario; el panel lo busca dentro de site/.
      - name: Empaquetar
        run: |
          if [ -f "target/$OBJETIVO/site/hash.txt" ]; then
            cp "target/$OBJETIVO/site/hash.txt" target/site/hash.txt
          fi
          commit=$(git rev-parse 'HEAD^{commit}')
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$commit") \
            bash deploy/cross/empaquetar-freebsd.sh "$VERSION" "$commit" \
            "target/$OBJETIVO/release/panel" target/site . dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routerpanel-x86_64-unknown-freebsd
          path: dist/routerpanel-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: [version, compilar, freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: routerpanel-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          tools/empaquetar-release.sh --sumas dist
          test "$(wc -l <dist/SHA256SUMS)" -eq 3
          cat dist/SHA256SUMS
      # Una atestación por archivo de SHA256SUMS (con su sha256).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Firmar SHA256SUMS (si hay MINISIGN_CLAVE_SECRETA)
        env:
          MINISIGN_CLAVE_SECRETA: ${{ secrets.MINISIGN_CLAVE_SECRETA }}
        run: |
          if [ -z "$MINISIGN_CLAVE_SECRETA" ]; then
            echo "sin MINISIGN_CLAVE_SECRETA: no se firma"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          clave=$(mktemp -p "$RUNNER_TEMP")
          trap 'rm -f "$clave"' EXIT
          printf '%s\n' "$MINISIGN_CLAVE_SECRETA" >"$clave"
          minisign -S -s "$clave" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig \
            -t "routerpanel $VERSION" </dev/null
      # Solo llegan aquí versiones finales (vX.Y.Z), así que es la última.
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- dist/routerpanel-*.tar.gz dist/SHA256SUMS
          if [ -f dist/SHA256SUMS.minisig ]; then set -- "$@" dist/SHA256SUMS.minisig; fi
          gh release create "$VERSION" "$@" --verify-tag --latest --title "$VERSION" --generate-notes
