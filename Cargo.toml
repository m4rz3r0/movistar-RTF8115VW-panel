[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
roxmltree = "0.20"
regex = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net"] }
tracing = "0.1"
axum = "0.8"
