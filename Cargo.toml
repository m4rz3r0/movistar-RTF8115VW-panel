[workspace]
resolver = "3"
members = ["crates/*", "tools/gen-catalogo", "tools/comprobar-publicacion"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
roxmltree = "0.20"
regex = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net"] }
tracing = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"
leptos = "0.8.22"
leptos_axum = "0.8.10"
leptos_meta = "0.8"
leptos_router = "0.8"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tower = "0.5"
wasm-bindgen = "=0.2.129"
web-sys = "0.3.106"
console_error_panic_hook = "0.1"
serde_json = "1"
tempfile = "3"
argon2 = "0.6"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"
form_urlencoded = "1"
rpassword = "7"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }

# Pruebas y desarrollo con información de depuración mínima: enlazar los
# binarios de pruebas con la completa necesitaba varios GB por enlace y, en
# paralelo, agotaba la memoria del servidor que compila las versiones.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "panel"
bin-package = "panel"
lib-package = "panel"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/panel/style/main.css"
assets-dir = "crates/panel/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
env = "DEV"
# Hash del contenido en los nombres del wasm, el JS y el CSS (el navegador
# los guarda para siempre: ver crates/panel/src/estaticos.rs). Los hashes van
# a target/site/hash.txt (la ruta es relativa a target/<perfil>), dentro de
# la web que copia el despliegue; el panel los busca allí.
hash-files = true
hash-file-name = "../site/hash.txt"
