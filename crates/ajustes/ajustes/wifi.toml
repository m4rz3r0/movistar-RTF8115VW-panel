# WiFi: las tres redes (2,4 GHz, 5 GHz e invitados) y las dos radios.
#
# Efectos: `wifi_red` en la tarjeta básica de cada red (cambiar el nombre,
# la contraseña o la seguridad obliga a volver a conectar los dispositivos) y
# `wifi_corte` en el resto.
#
# Cada red y cada radio se parte en dos ajustes: lo esencial (nivel básico) y
# «…_avanzado» (nivel avanzado), porque el nivel es del ajuste, no del campo.
# Los dos escriben en la misma instancia con los mismos `fijos`.
#
# Ids de las instancias (fixtures del router): radio 0 = 2,4 GHz, radio 1 =
# 5 GHz; punto de acceso 0 = red principal de 2,4 GHz, 1 = red principal de
# 5 GHz, 2 = primera red de invitados (en la radio de 2,4 GHz).
# Las radios se leen buscando su id (`buscar`): el router las elige por su
# posición, que no tiene por qué ser el id con que se escriben.
#
# Encender o apagar una red es `activa` (`adm_state`), en la tarjeta básica.
# Comprobado en el router real (2026-10-22): con las redes apagadas, todos
# los puntos de acceso traen `adm_state=0` y `opr_status=0` mientras las
# radios siguen con `radio_adm_state=1` y `radio_opr_status=1`: `adm_state`
# enciende o apaga la red y `opr_status` dice si de verdad emite (de ahí la
# insignia de la tarjeta).

[[ajuste]]
id = "wifi.red_24"
tema = "wifi"
nivel = "basico"
efecto = "wifi_red"
leer = { funcion = "cbGetWifiAccPt", params = { dpm_cfg_wifi_acc_pt_id = "0" } }
fijos = { dpm_cfg_wifi_acc_pt_id = "0" }

# Encender o apagar la red: lo primero de la tarjeta (nota del principio).
[[ajuste.campo]]
id = "activa"
escribe = { funcion = "cbSetWifiAccPt", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
textos_valor = true
recomendado = "true"

[[ajuste.campo]]
id = "nombre"
escribe = { funcion = "cbSetWifiAccPt", parametro = "ssid" }
lee = "ssid"
tipo = "texto"
validar = { min = 1, max = 32 }

[[ajuste.campo]]
id = "contrasena"
escribe = { funcion = "cbSetWifiAccPt", parametro = "key_phrase" }
lee = "key_phrase"
tipo = "secreto"
validar = { min = 8, max = 63, ascii = true }

# La frase WPA es ASCII imprimible (32–126), de 8 a 63 caracteres.
# WPA2 con AES o abierta. TKIP, WEP y el modo mixto WPA/WPA2 no se ofrecen:
# si el router los tiene puestos, se ven como valor desconocido.
[[ajuste.campo]]
id = "seguridad"
escribe = { funcion = "cbSetWifiAccPt", parametro = "authentication" }
lee = "authentication"
tipo = "opcion"
ademas = [{ parametro = "encryption", lee = "encryption" }]
opciones = [
  { valor = "3", clave = "wpa2", recomendada = true, ademas = { encryption = "4" } },
  { valor = "0", clave = "abierta", aviso = "wifi_abierta", ademas = { encryption = "0" } },
]
seguridad = true

[[ajuste.campo]]
id = "visible"
escribe = { funcion = "cbSetWifiAccPt", parametro = "ssid_hide" }
lee = "ssid_hide"
tipo = "booleano"
invertido = true
recomendado = "true"

[[ajuste.campo]]
id = "wps"
escribe = { funcion = "cbSetWifiAccPt", parametro = "wps_adm_state" }
lee = "wps_adm_state"
tipo = "booleano"
recomendado = "false"
seguridad = true

[[ajuste]]
id = "wifi.red_24_avanzado"
tema = "wifi"
nivel = "avanzado"
efecto = "wifi_corte"
leer = { funcion = "cbGetWifiAccPt", params = { dpm_cfg_wifi_acc_pt_id = "0" } }
fijos = { dpm_cfg_wifi_acc_pt_id = "0" }

# Si la red está separada de la red de casa. Solo se lee: la escritura de
# los puntos de acceso de la web avanzada no tiene este parámetro, y el
# panel no inventa uno.
[[ajuste.campo]]
id = "separada"
lee = "guest_networking"
tipo = "booleano"
solo_lectura = "ajuste-wifi-red_24_avanzado-separada-motivo"

[[ajuste.campo]]
id = "aislamiento"
escribe = { funcion = "cbSetWifiAccPt", parametro = "isolation" }
lee = "isolation"
tipo = "booleano"
recomendado = "false"

[[ajuste.campo]]
id = "wmm"
escribe = { funcion = "cbSetWifiAccPt", parametro = "wmm" }
lee = "wmm"
tipo = "booleano"
recomendado = "true"

[[ajuste.campo]]
id = "max_clientes"
escribe = { funcion = "cbSetWifiAccPt", parametro = "max_clt_count" }
lee = "max_clt_count"
tipo = "numero"
validar = { min = 1, max = 64 }

# Protección de las tramas de gestión. Solo se lee hasta que una escritura
# con `validation_only = 1` sobre una red apagada confirme qué valores
# acepta (validación E2 del controlador): no entra en el catálogo de
# escritura, porque viajaría en toda escritura de la red.
[[ajuste.campo]]
id = "pmf"
lee = "wifi_pmf"
tipo = "opcion"
opciones = [{ valor = "0", clave = "desactivada" }]
solo_lectura = "ajuste-wifi-red_24_avanzado-pmf-motivo"

# Bloqueo del WPS: lo pone el router; el panel solo lo enseña. El método
# (`wps_method`) no es campo: su significado está sin validar y queda en
# «Detalles técnicos».
[[ajuste.campo]]
id = "wps_bloqueo"
lee = "wps_setup_lock"
tipo = "booleano"
solo_lectura = "ajuste-wifi-red_24_avanzado-wps_bloqueo-motivo"

# Cada cuánto renueva el router la clave de grupo, en segundos. Ya viajaba
# en toda escritura de la red con su valor leído; aquí se puede elegir.
# Pendiente de la validación E1 del controlador: si falla, pasa a
# `solo_lectura` con su motivo.
[[ajuste.campo]]
id = "renovacion_clave"
escribe = { funcion = "cbSetWifiAccPt", parametro = "regen_key_interval" }
lee = "regen_key_interval"
tipo = "opcion"
opciones = [
  { valor = "0", clave = "nunca" },
  { valor = "3600", clave = "hora" },
  { valor = "86400", clave = "dia" },
]

