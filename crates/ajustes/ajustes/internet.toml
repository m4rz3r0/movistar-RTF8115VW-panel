# Internet: la conexión a internet y la fibra (solo de lectura), el relé
# DNS y el DNS dinámico. La conexión no se cambia desde el panel: depende de
# la detectada y cambiarla puede cortar el acceso (ver `excluidas.toml`).

# Conexión a internet: una instancia por conexión del router, con
# su id (`ip_intf_id`, el de las rutas). La de internet es la que elige la
# detección del router; las demás (voz, servicios) se marcan «del operador».
[[ajuste]]
id = "internet.conexion"
tema = "internet"
nivel = "basico"
lista = true
componente = "conexion"
leer = { funcion = "cbGetWanIPIntf" }

[[ajuste.campo]]
id = "tipo"
lee = "wan_type"
tipo = "opcion"
solo_lectura = "ajuste-internet-conexion-motivo"
opciones = [
  { valor = "0", clave = "pppoe" },
  { valor = "1", clave = "dhcp" },
  { valor = "2", clave = "fija" },
]

[[ajuste.campo]]
id = "estado"
lee = "opr_status"
tipo = "booleano"
textos_valor = true
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "ip"
lee = "dis_ipv4_addr"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "puerta"
lee = "dis_ipv4_gw"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "dns_1"
lee = "dnsv4_svr0"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "dns_2"
lee = "dnsv4_svr1"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "vlan"
lee = "vlanid"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "mtu"
lee = "mtu"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "ipv6"
lee = "ipv6_opr_status"
tipo = "booleano"
textos_valor = true
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "usuario"
lee = "username"
tipo = "texto"
solo_lectura = "ajuste-internet-conexion-motivo"

[[ajuste.campo]]
id = "contrasena"
lee = "password"
tipo = "secreto"
solo_lectura = "ajuste-internet-conexion-motivo"

# La fibra (GPON): el estado de la ONT según ITU-T G.984 (O1…O7; O5 es
# «Operativa»), los números de serie y la contraseña GPON, como secretos.
[[ajuste]]
id = "internet.fibra"
tema = "internet"
nivel = "avanzado"
leer = { funcion = "cbGetGPONInfo" }

[[ajuste.campo]]
id = "estado"
lee = "Opstatus"
tipo = "opcion"
solo_lectura = "ajuste-internet-fibra-motivo"
opciones = [
  { valor = "1", clave = "o1" },
  { valor = "2", clave = "o2" },
  { valor = "3", clave = "o3" },
  { valor = "4", clave = "o4" },
  { valor = "5", clave = "o5" },
  { valor = "6", clave = "o6" },
  { valor = "7", clave = "o7" },
]

[[ajuste.campo]]
id = "serie"
lee = "GponSerialNumber"
tipo = "secreto"
solo_lectura = "ajuste-internet-fibra-motivo"

[[ajuste.campo]]
id = "serie_acs"
lee = "AcsSerialNumber"
tipo = "secreto"
solo_lectura = "ajuste-internet-fibra-motivo"

[[ajuste.campo]]
id = "contrasena"
lee = "Password"
tipo = "secreto"
solo_lectura = "ajuste-internet-fibra-motivo"

[[ajuste]]
id = "internet.dns"
tema = "internet"
nivel = "avanzado"
leer = { funcion = "cbGetDnsRelay" }

[[ajuste.campo]]
id = "rele"
escribe = { funcion = "cbSetDnsRelay", parametro = "dns_relay_adm_state" }
lee = "dns_relay_adm_state"
tipo = "booleano"
# Sin recomendación hasta comprobar con el router real qué
# cambia al encender el relé (con él apagado, el router ya contesta al DNS).

# Cuenta y contraseña: secretos de la web avanzada, editables.
[[ajuste]]
id = "internet.ddns"
tema = "internet"
nivel = "oculto"
lista = true
leer = { funcion = "cbGetDdns", params = { all = "ALL" } }

[[ajuste.campo]]
id = "activa"
escribe = { funcion = "cbSetDdns", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"

[[ajuste.campo]]
id = "servicio"
escribe = { funcion = "cbSetDdns", parametro = "provider" }
lee = "provider"
tipo = "opcion"
opciones = [
  { valor = "0", clave = "no_ip" },
  { valor = "1", clave = "now_ip" },
  { valor = "2", clave = "dyndns" },
  { valor = "3", clave = "now_dns" },
]

[[ajuste.campo]]
id = "nombre"
escribe = { funcion = "cbSetDdns", parametro = "hostname" }
lee = "hostname"
tipo = "texto"
validar = { min = 1, max = 253 }

[[ajuste.campo]]
id = "cuenta"
escribe = { funcion = "cbSetDdns", parametro = "account" }
lee = "account"
tipo = "texto"
validar = { min = 1 }

[[ajuste.campo]]
id = "contrasena"
escribe = { funcion = "cbSetDdns", parametro = "password" }
lee = "password"
tipo = "secreto"
validar = { min = 1 }

# Elementos de la pestaña (spec §5.1). La conexión a internet, de solo
# lectura, con la fibra; su estado también va en la franja de resumen.
[[elemento]]
id = "conexion"
tema = "internet"
ajustes = ["internet.conexion", "internet.fibra"]
icono = "globo"
estado = "derivado:estado_conexion"

[[elemento]]
id = "dns"
tema = "internet"
ajustes = ["internet.dns"]
icono = "globo"
interruptor = "internet.dns.rele"
datos = ["internet.dns.rele"]
estado = "derivado:estado_dns"

[[elemento]]
id = "ddns"
tema = "internet"
ajustes = ["internet.ddns"]
icono = "globo"
datos = ["derivado:nombres_ddns"]
estado = "derivado:estado_ddns"

# Acciones (spec §5.5): el relé, de un clic para lo marcado.
[[accion]]
id = "activar_rele"
tema = "internet"
campo = "rele"
valor = "true"

[[accion]]
id = "desactivar_rele"
tema = "internet"
campo = "rele"
valor = "false"
