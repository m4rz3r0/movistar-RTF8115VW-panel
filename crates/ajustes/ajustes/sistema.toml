# Sistema: hora del router (servidores de hora), espejo de la conexión a
# internet para diagnóstico y registro del sistema.

[[ajuste]]
id = "sistema.hora"
tema = "sistema"
nivel = "avanzado"
leer = { funcion = "cbGetTimeNtp" }

[[ajuste.campo]]
id = "activa"
escribe = { funcion = "cbSetTimeNtp", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
recomendado = "true"
respaldo = "criterio"

[[ajuste.campo]]
id = "servidor_1"
escribe = { funcion = "cbSetTimeNtp", parametro = "ntp_svr_1" }
lee = "ntp_svr_1"
tipo = "texto"
validar = { min = 1, max = 253, ascii = true }
# Un servidor público y neutro (el de la hora oficial de España), en lugar
# del que deja puesto el operador. Los del proyecto NTP Pool también son
# neutros: con ellos no se recomienda nada.
recomendado = "hora.roa.es"
respaldo = "criterio"
aceptados = ["pool.ntp.org", "*.pool.ntp.org"]

[[ajuste.campo]]
id = "servidor_2"
escribe = { funcion = "cbSetTimeNtp", parametro = "ntp_svr_2" }
lee = "ntp_svr_2"
tipo = "texto"
opcional = true
validar = { max = 253, ascii = true }
# De reserva, también uno neutro; vacío vale.
recomendado = "es.pool.ntp.org"
respaldo = "criterio"
aceptados = ["", "hora.roa.es", "pool.ntp.org", "*.pool.ntp.org"]

# El espejo copia todo lo que entra y sale de internet a un puerto de la
# red de casa. Con el espejo apagado el router da la toma 0, que no es una
# opción que se pueda escribir: se lee como «Ninguna» (`sin_eleccion`).
# Encenderlo exige elegir una toma (`requiere`; «Ninguna» no cuenta): si no,
# se escribiría la toma 0.
[[ajuste]]
id = "sistema.diagnostico"
tema = "sistema"
nivel = "oculto"
leer = { funcion = "cbGetDiagConfig" }

[[ajuste.campo]]
id = "espejo"
escribe = { funcion = "cbSetDiagConfig", parametro = "wan_mirror" }
lee = "wan_mirror"
tipo = "booleano"
recomendado = "false"
respaldo = "criterio"
requiere = { campo = "puerto", cuando = "true" }

[[ajuste.campo]]
id = "puerto"
escribe = { funcion = "cbSetDiagConfig", parametro = "dst_lan_port" }
lee = "dst_lan_port"
tipo = "opcion"
sin_eleccion = "0"
opciones = [
  { valor = "1", clave = "puerto_1" },
  { valor = "2", clave = "puerto_2" },
  { valor = "4", clave = "puerto_3" },
  { valor = "8", clave = "puerto_4" },
]

# Registro del sistema: si el router envía su registro a otro equipo. «Sí»
# es local y remoto (`2`: no se pierde el registro local) y «no», solo local
# (`0`). Solo remoto (`1`) se lee como no reconocido. Encender el envío
# exige el servidor. La escritura nunca lleva `export` (exportaría el
# registro): no está en el catálogo de la función.
[[ajuste]]
id = "sistema.registro"
tema = "sistema"
nivel = "avanzado"
leer = { funcion = "cbGetSyslog" }

[[ajuste.campo]]
id = "envio"
escribe = { funcion = "cbSetSyslog", parametro = "syslog_mode" }
lee = "syslog_mode"
tipo = "booleano"
booleano = { si = "2", no = "0" }
recomendado = "false"
respaldo = "criterio"
requiere = { campo = "servidor", cuando = "true" }

[[ajuste.campo]]
id = "servidor"
escribe = { funcion = "cbSetSyslog", parametro = "remote_ip" }
lee = "remote_ip"
tipo = "ip"
opcional = true

[[ajuste.campo]]
id = "puerto"
escribe = { funcion = "cbSetSyslog", parametro = "remote_port" }
lee = "remote_port"
tipo = "numero"
validar = { min = 1, max = 65535 }

# Elementos de la pestaña (spec §5.1).
[[elemento]]
id = "hora"
tema = "sistema"
ajustes = ["sistema.hora"]
icono = "reloj"
interruptor = "sistema.hora.activa"
datos = ["sistema.hora.activa", "sistema.hora.servidor_1", "sistema.hora.servidor_2"]
estado = "derivado:estado_hora"

[[elemento]]
id = "diagnostico"
tema = "sistema"
ajustes = ["sistema.diagnostico"]
icono = "lupa"
datos = ["sistema.diagnostico.espejo", "sistema.diagnostico.puerto"]
estado = "derivado:estado_diagnostico"

[[elemento]]
id = "registro"
tema = "sistema"
ajustes = ["sistema.registro"]
icono = "registro"
interruptor = "sistema.registro.envio"
datos = ["sistema.registro.servidor", "sistema.registro.puerto"]
estado = "derivado:segun_lo_recomendado"

# Acciones (spec §5.5).
[[accion]]
id = "usar_hora_neutra"
tema = "sistema"
campo = "servidor_1"
valor = "hora.roa.es"
