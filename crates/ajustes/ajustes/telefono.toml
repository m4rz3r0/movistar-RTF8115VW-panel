# Teléfono fijo (voz por internet). Lo configura el operador: todo va bajo
# «Más opciones». Línea 0 y puerto de teléfono 0, los únicos de las
# fixtures. Los números, las cuentas y las direcciones de los servidores son
# secretos de la web avanzada (`voiceadvance.asp`): se pueden editar.

[[ajuste]]
id = "telefono.linea"
tema = "telefono"
nivel = "avanzado"
leer = { funcion = "cbGetVoiceLine", params = { interwork_id = "0" } }
fijos = { interwork_id = "0" }

[[ajuste.campo]]
id = "activa"
escribe = { funcion = "cbSetVoiceLine", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"

[[ajuste.campo]]
id = "silencio"
escribe = { funcion = "cbSetVoiceLine", parametro = "vad_state" }
lee = "vad_state"
tipo = "booleano"
recomendado = "false"
respaldo = "criterio"

# El router la da vacía al leerla (`tapado` en el catálogo de funciones):
# cualquier guardado de la línea la reenvía, así que la página la pide al
# guardar y el servidor no escribe sin ella.
[[ajuste.campo]]
id = "contrasena"
escribe = { funcion = "cbSetVoiceLine", parametro = "auth_password" }
lee = "auth_password"
tipo = "secreto"
validar = { min = 1 }

# Estado de la línea, solo de lectura. Comprobado en el router real: `Up` e
# `Idle` con la línea activa y sin llamada. Los demás son los estados
# habituales de TR-104 (aún sin ver en este modelo); uno que no esté aquí se
# enseña tal cual.
[[ajuste.campo]]
id = "en_servicio"
lee = "clt_status"
tipo = "opcion"
solo_lectura = "ajuste-telefono-linea-motivo"
opciones = [
  { valor = "Up", clave = "activa" },
  { valor = "Disabled", clave = "desactivada" },
  { valor = "Initializing", clave = "arrancando" },
  { valor = "Registering", clave = "registrandose" },
  { valor = "Unregistering", clave = "dandose_de_baja" },
  { valor = "Error", clave = "con_error" },
  { valor = "Testing", clave = "en_pruebas" },
  { valor = "Quiescent", clave = "sin_llamadas_nuevas" },
]

[[ajuste.campo]]
id = "llamada"
lee = "call_status"
tipo = "opcion"
solo_lectura = "ajuste-telefono-linea-motivo"
opciones = [
  { valor = "Idle", clave = "sin_llamada" },
  { valor = "Calling", clave = "llamando" },
  { valor = "Ringing", clave = "sonando" },
  { valor = "Connecting", clave = "conectando" },
  { valor = "InCall", clave = "en_llamada" },
  { valor = "Hold", clave = "en_espera" },
  { valor = "Disconnecting", clave = "colgando" },
]

# Como en `telefono.linea`, la contraseña de la línea (tapada al leerla) va
# también aquí: cualquier guardado de estos datos la reenvía.
[[ajuste]]
id = "telefono.linea_oculto"
tema = "telefono"
nivel = "oculto"
leer = { funcion = "cbGetVoiceLine", params = { interwork_id = "0" } }
fijos = { interwork_id = "0" }

[[ajuste.campo]]
id = "usuario"
escribe = { funcion = "cbSetVoiceLine", parametro = "auth_username" }
lee = "auth_username"
tipo = "texto"
validar = { min = 1 }

[[ajuste.campo]]
id = "linea_directa"
escribe = { funcion = "cbSetVoiceLine", parametro = "warmline_hotline" }
lee = "warmline_hotline"
tipo = "booleano"

[[ajuste.campo]]
id = "numero_directo"
escribe = { funcion = "cbSetVoiceLine", parametro = "warmline_hotline_number" }
lee = "warmline_hotline_number"
tipo = "texto"
validar = { min = 1 }

[[ajuste.campo]]
id = "contrasena"
escribe = { funcion = "cbSetVoiceLine", parametro = "auth_password" }
lee = "auth_password"
tipo = "secreto"
validar = { min = 1 }

[[ajuste]]
id = "telefono.sip"
tema = "telefono"
nivel = "avanzado"
leer = { funcion = "cbGetVoiceSip" }

[[ajuste.campo]]
id = "tonos"
escribe = { funcion = "cbSetVoiceSip", parametro = "dtmf_method" }
lee = "dtmf_method"
tipo = "opcion"
opciones = [
  { valor = "2", clave = "aparte", recomendada = true, respaldo = "criterio" },
  { valor = "1", clave = "en_la_voz" },
  { valor = "3", clave = "mensajes" },
]

[[ajuste.campo]]
id = "fax"
escribe = { funcion = "cbSetVoiceSip", parametro = "t38_enable" }
lee = "t38_enable"
tipo = "booleano"

[[ajuste]]
id = "telefono.sip_oculto"
tema = "telefono"
nivel = "oculto"
# Apagarlo (o un servidor mal escrito) deja el fijo sin servicio: el
# interruptor de su tarjeta pregunta antes de apagarlo. Se recomienda
# apagarlo si no hay fijo («Apagar la línea de voz», fuera de los lotes): el
# router deja de registrarse en el operador. No se decide solo: el puerto de
# teléfono sale en servicio aunque no haya ningún teléfono conectado.
efecto = "telefono_corte"
leer = { funcion = "cbGetVoiceSip" }

[[ajuste.campo]]
id = "activo"
escribe = { funcion = "cbSetVoiceSip", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
recomendado = "false"
respaldo = "criterio"

# Si el router está registrado en el servidor de voz del operador (solo de
# lectura; en el router real vale 1 aunque no haya ningún teléfono conectado).
[[ajuste.campo]]
id = "estado_registro"
lee = "net_status"
tipo = "opcion"
solo_lectura = "ajuste-telefono-sip_oculto-motivo"
opciones = [
  { valor = "1", clave = "registrada" },
  { valor = "0", clave = "sin_registrar" },
]

[[ajuste.campo]]
id = "dominio"
escribe = { funcion = "cbSetVoiceSip", parametro = "user_agent_domain" }
lee = "user_agent_domain"
tipo = "texto"
validar = { min = 1, max = 253, ascii = true }

[[ajuste.campo]]
id = "servidor"
escribe = { funcion = "cbSetVoiceSip", parametro = "proxy_server_cfg" }
lee = "proxy_server_cfg"
tipo = "texto"
validar = { min = 1, max = 253, ascii = true }

[[ajuste.campo]]
id = "servidor_puerto"
escribe = { funcion = "cbSetVoiceSip", parametro = "proxy_server_port" }
lee = "proxy_server_port"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "registro"
escribe = { funcion = "cbSetVoiceSip", parametro = "registrar_server_cfg" }
lee = "registrar_server_cfg"
tipo = "texto"
validar = { min = 1, max = 253, ascii = true }

[[ajuste.campo]]
id = "registro_puerto"
escribe = { funcion = "cbSetVoiceSip", parametro = "registrar_server_port" }
lee = "registrar_server_port"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "salida"
escribe = { funcion = "cbSetVoiceSip", parametro = "outbound_proxy_cfg" }
lee = "outbound_proxy_cfg"
tipo = "texto"
validar = { min = 1, max = 253, ascii = true }

[[ajuste.campo]]
id = "salida_puerto"
escribe = { funcion = "cbSetVoiceSip", parametro = "outbound_proxy_port" }
lee = "outbound_proxy_port"
tipo = "numero"
validar = { min = 1, max = 65535 }

# Puerto de teléfono 0: paso directo de fax y módem. Las ganancias se dejan
# fuera hasta saber su rango y su signo en este router.
[[ajuste]]
id = "telefono.fisico"
tema = "telefono"
nivel = "avanzado"
leer = { funcion = "cbGetVoicePhysical" }
fijos = { fxs_id = "0" }

[[ajuste.campo]]
id = "fax"
escribe = { funcion = "cbSetVoicePhysical", parametro = "fax_passthrough_adm_state" }
lee = "fax_passthrough_adm_state"
# Un desplegable en la web del router (voiceadvance.asp), no un sí/no.
tipo = "opcion"
opciones = [
  { valor = "0", clave = "no" },
  { valor = "1", clave = "auto" },
  { valor = "2", clave = "siempre" },
]

[[ajuste.campo]]
id = "modem"
escribe = { funcion = "cbSetVoicePhysical", parametro = "modem_passthrough_adm_state" }
lee = "modem_passthrough_adm_state"
# Un desplegable en la web del router (voiceadvance.asp), no un sí/no.
tipo = "opcion"
opciones = [
  { valor = "0", clave = "no" },
  { valor = "1", clave = "auto" },
  { valor = "2", clave = "siempre" },
]

# El puerto de teléfono en servicio (solo de lectura). En el router real
# sale en servicio aunque no haya ningún teléfono conectado: no dice si hay
# uno.
[[ajuste.campo]]
id = "puerto"
lee = "opr_status"
tipo = "booleano"
textos_valor = true
solo_lectura = "ajuste-telefono-fisico-motivo"

# Elementos de la pestaña (spec §5.1). Sin interruptor ni acciones en la
# línea: guardarla reenvía su contraseña, que el router no deja leer, y
# solo el detalle la pide. El teléfono por internet y el paso directo del
# fax, sí.
[[elemento]]
id = "linea"
tema = "telefono"
ajustes = ["telefono.linea", "telefono.linea_oculto"]
icono = "telefono"
datos = ["telefono.linea.activa", "telefono.linea.en_servicio", "telefono.linea.silencio", "telefono.linea_oculto.usuario",
         "telefono.linea_oculto.linea_directa", "telefono.linea_oculto.numero_directo"]
estado = "derivado:estado_linea"

[[elemento]]
id = "llamadas"
tema = "telefono"
ajustes = ["telefono.sip"]
icono = "telefono"
datos = ["telefono.sip.tonos", "telefono.sip.fax"]
estado = "derivado:segun_lo_recomendado"

[[elemento]]
id = "servidores"
tema = "telefono"
ajustes = ["telefono.sip_oculto"]
icono = "telefono"
interruptor = "telefono.sip_oculto.activo"
datos = ["telefono.sip_oculto.activo", "telefono.sip_oculto.estado_registro",
         "telefono.sip_oculto.dominio",
         "telefono.sip_oculto.servidor", "telefono.sip_oculto.registro"]
estado = "derivado:estado_voz"

[[elemento]]
id = "fax-y-modem"
tema = "telefono"
ajustes = ["telefono.fisico"]
icono = "fax"
datos = ["telefono.fisico.fax", "telefono.fisico.modem", "telefono.fisico.puerto"]
estado = "derivado:estado_paso_directo"

# Acciones (spec §5.5): el teléfono por internet, de un clic para lo
# marcado (apagarlo avisa de su efecto en la revisión).
[[accion]]
id = "encender_voz"
tema = "telefono"
campo = "activo"
valor = "true"

[[accion]]
id = "apagar_voz"
tema = "telefono"
campo = "activo"
valor = "false"
