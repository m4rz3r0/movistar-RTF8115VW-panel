# Puertos: reglas de apertura, UPnP y ayudantes de protocolos (ALG).

[[ajuste]]
id = "puertos.reglas"
tema = "puertos"
nivel = "basico"
lista = true
componente = "puertos"
# La DMZ es una instancia más de la lista (`desc=DMZ`): no es una regla.
leer = { funcion = "cbGetNatPortMapping", excluir = { desc = "DMZ" } }
# Columnas de su lista en la página (el nombre va siempre delante).
columnas = ["protocolo", "externo", "destino", "activa"]

[[ajuste.campo]]
id = "nombre"
escribe = { funcion = "cbSetNatPortMapping", parametro = "desc" }
lee = "desc"
tipo = "texto"
validar = { min = 1, max = 64 }

[[ajuste.campo]]
id = "protocolo"
escribe = { funcion = "cbSetNatPortMapping", parametro = "l4_protocol_value" }
lee = "l4_protocol_value"
tipo = "opcion"
opciones = [
  { valor = "6", clave = "tcp" },
  { valor = "17", clave = "udp" },
]

[[ajuste.campo]]
id = "externo_desde"
escribe = { funcion = "cbSetNatPortMapping", parametro = "ext_l4_port_min_value" }
lee = "ext_l4_port_min_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "externo_hasta"
escribe = { funcion = "cbSetNatPortMapping", parametro = "ext_l4_port_max_value" }
lee = "ext_l4_port_max_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "destino"
escribe = { funcion = "cbSetNatPortMapping", parametro = "int_ip_addr" }
lee = "int_ip_addr"
tipo = "ip"

[[ajuste.campo]]
id = "interno_desde"
escribe = { funcion = "cbSetNatPortMapping", parametro = "int_l4_port_min_value" }
lee = "int_l4_port_min_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "interno_hasta"
escribe = { funcion = "cbSetNatPortMapping", parametro = "int_l4_port_max_value" }
lee = "int_l4_port_max_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "activa"
escribe = { funcion = "cbSetNatPortMapping", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
# Una regla nueva nace activa, como en la web del router.
recomendado = "true"
respaldo = "criterio"

[[ajuste]]
id = "puertos.upnp"
tema = "puertos"
nivel = "basico"
leer = { funcion = "cbGetUpnpCfg" }

[[ajuste.campo]]
id = "activo"
escribe = { funcion = "cbSetUpnpCfg", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
recomendado = "false"
fuentes = ["nsa-red-casa", "cisa-red-casa"]
respaldo = "consenso"

# Como natalg.asp: casillas por presencia y `set_nf_conntrack=1` fijo, que
# el catálogo añade al escribir (comprobado en el router real).
[[ajuste]]
id = "puertos.alg"
tema = "puertos"
nivel = "oculto"
leer = { funcion = "cbGetNatConfig" }

[[ajuste.campo]]
id = "ftp"
escribe = { funcion = "cbSetNatConfig", parametro = "ftp_enable" }
lee = "ftp_enable"
tipo = "booleano"

[[ajuste.campo]]
id = "sip"
escribe = { funcion = "cbSetNatConfig", parametro = "sip_enable" }
lee = "sip_enable"
tipo = "booleano"

[[ajuste.campo]]
id = "pptp"
escribe = { funcion = "cbSetNatConfig", parametro = "pptp_enable" }
lee = "pptp_enable"
tipo = "booleano"

[[ajuste.campo]]
id = "h323"
escribe = { funcion = "cbSetNatConfig", parametro = "h323_enable" }
lee = "h323_enable"
tipo = "booleano"

# DMZ, solo de lectura: el equipo que recibe todo lo que llega de
# internet sin regla. En el router real es una instancia de las
# redirecciones con `desc=DMZ`, sin protocolo ni puertos (la crea natdmz.asp
# al aplicar, aunque quede apagada); `dmz=1` no la lee. Activa si está
# encendida y con un equipo (`derivado:estado_dmz`).
[[ajuste]]
id = "puertos.dmz"
tema = "puertos"
nivel = "avanzado"
lista = true
leer = { funcion = "cbGetNatPortMapping", solo = { desc = "DMZ" } }

[[ajuste.campo]]
id = "equipo"
lee = "int_ip_addr"
tipo = "ip"
# Ninguna guía consultada habla de la DMZ.
respaldo = "criterio"
solo_lectura = "ajuste-puertos-dmz-motivo"

[[ajuste.campo]]
id = "activa"
lee = "adm_state"
tipo = "booleano"
solo_lectura = "ajuste-puertos-dmz-motivo"

# NAT loopback (natloopback.asp): desde casa, entrar a un servicio propio
# por la dirección pública. Comprobado en el router real.
[[ajuste]]
id = "puertos.loopback"
tema = "puertos"
nivel = "avanzado"
leer = { funcion = "cbGetNatConfig" }

[[ajuste.campo]]
id = "activo"
escribe = { funcion = "cbSetNatConfig.loopback", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"

# Encima de la lista de reglas, una tarjeta por ajuste que no es lista
# (spec §4.2); las reglas son los elementos de la lista.
[[elemento]]
id = "upnp"
tema = "puertos"
ajustes = ["puertos.upnp"]
icono = "puerta"
interruptor = "puertos.upnp.activo"
estado = "derivado:segun_lo_recomendado"

# Estado: desactivada (gris) o activa (en ámbar, con una recomendación que
# solo informa).
[[elemento]]
id = "dmz"
tema = "puertos"
ajustes = ["puertos.dmz"]
icono = "puerta"
estado = "derivado:estado_dmz"

[[elemento]]
id = "loopback"
tema = "puertos"
ajustes = ["puertos.loopback"]
icono = "puerta"
interruptor = "puertos.loopback.activo"

[[elemento]]
id = "alg"
tema = "puertos"
ajustes = ["puertos.alg"]
icono = "puerta"
datos = ["puertos.alg.ftp", "puertos.alg.sip", "puertos.alg.pptp", "puertos.alg.h323"]

# Acciones sobre las reglas marcadas (spec §5.5).
[[accion]]
id = "activar_regla"
tema = "puertos"
lista = "puertos.reglas"
campo = "activa"
valor = "true"

[[accion]]
id = "desactivar_regla"
tema = "puertos"
lista = "puertos.reglas"
campo = "activa"
valor = "false"

[[accion]]
id = "borrar_regla"
tema = "puertos"
lista = "puertos.reglas"
borrar = true
peligro = true
