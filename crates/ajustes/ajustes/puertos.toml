# Puertos: reglas de apertura, UPnP y ayudantes de protocolos (ALG).

[[ajuste]]
id = "puertos.reglas"
tema = "puertos"
nivel = "basico"
lista = true
componente = "puertos"
leer = { funcion = "cbGetNatPortMapping" }
# Columnas de su lista en la página (el nombre va siempre delante).
columnas = ["protocolo", "externo", "destino", "activa"]

[[ajuste.campo]]
id = "nombre"
escribe = { funcion = "cbSetNatPortMapping", parametro = "desc" }
lee = "desc"
tipo = "texto"
validar = { min = 1, max = 64 }

[[ajuste.campo]]
id = "protocolo"
escribe = { funcion = "cbSetNatPortMapping", parametro = "l4_protocol_value" }
lee = "l4_protocol_value"
tipo = "opcion"
opciones = [
  { valor = "6", clave = "tcp" },
  { valor = "17", clave = "udp" },
]

[[ajuste.campo]]
id = "externo_desde"
escribe = { funcion = "cbSetNatPortMapping", parametro = "ext_l4_port_min_value" }
lee = "ext_l4_port_min_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "externo_hasta"
escribe = { funcion = "cbSetNatPortMapping", parametro = "ext_l4_port_max_value" }
lee = "ext_l4_port_max_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "destino"
escribe = { funcion = "cbSetNatPortMapping", parametro = "int_ip_addr" }
lee = "int_ip_addr"
tipo = "ip"

[[ajuste.campo]]
id = "interno_desde"
escribe = { funcion = "cbSetNatPortMapping", parametro = "int_l4_port_min_value" }
lee = "int_l4_port_min_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "interno_hasta"
escribe = { funcion = "cbSetNatPortMapping", parametro = "int_l4_port_max_value" }
lee = "int_l4_port_max_value"
tipo = "numero"
validar = { min = 1, max = 65535 }

[[ajuste.campo]]
id = "activa"
escribe = { funcion = "cbSetNatPortMapping", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
# Una regla nueva nace activa (decisión del controlador, Tarea 10).
recomendado = "true"

[[ajuste]]
id = "puertos.upnp"
tema = "puertos"
nivel = "basico"
leer = { funcion = "cbGetUpnpCfg" }

[[ajuste.campo]]
id = "activo"
escribe = { funcion = "cbSetUpnpCfg", parametro = "adm_state" }
lee = "adm_state"
tipo = "booleano"
recomendado = "false"

# Solo lectura: al escribir, el router necesita un dato que no devuelve al
# leer, así que el panel no podría deshacer el cambio (`cbSetNatConfig` está
# en `excluidas.toml`). Se revisará al probar con el router real (fase 3).
[[ajuste]]
id = "puertos.alg"
tema = "puertos"
nivel = "oculto"
leer = { funcion = "cbGetNatConfig" }

[[ajuste.campo]]
id = "ftp"
lee = "ftp_enable"
tipo = "booleano"
solo_lectura = "ajuste-puertos-alg-motivo"

[[ajuste.campo]]
id = "sip"
lee = "sip_enable"
tipo = "booleano"
solo_lectura = "ajuste-puertos-alg-motivo"

[[ajuste.campo]]
id = "pptp"
lee = "pptp_enable"
tipo = "booleano"
solo_lectura = "ajuste-puertos-alg-motivo"

[[ajuste.campo]]
id = "h323"
lee = "h323_enable"
tipo = "booleano"
solo_lectura = "ajuste-puertos-alg-motivo"

# Encima de la lista de reglas, una tarjeta por ajuste que no es lista
# (spec §4.2); las reglas son los elementos de la lista.
[[elemento]]
id = "upnp"
tema = "puertos"
ajustes = ["puertos.upnp"]
icono = "puerta"
interruptor = "puertos.upnp.activo"
estado = "derivado:segun_lo_recomendado"

[[elemento]]
id = "alg"
tema = "puertos"
ajustes = ["puertos.alg"]
icono = "puerta"
datos = ["puertos.alg.ftp", "puertos.alg.sip", "puertos.alg.pptp", "puertos.alg.h323"]

# Acciones sobre las reglas marcadas (spec §5.5).
[[accion]]
id = "activar_regla"
tema = "puertos"
lista = "puertos.reglas"
campo = "activa"
valor = "true"

[[accion]]
id = "desactivar_regla"
tema = "puertos"
lista = "puertos.reglas"
campo = "activa"
valor = "false"

[[accion]]
id = "borrar_regla"
tema = "puertos"
lista = "puertos.reglas"
borrar = true
peligro = true
