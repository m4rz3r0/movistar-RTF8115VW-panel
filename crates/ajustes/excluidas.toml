# Funciones de escritura que ningún ajuste cubre, y por qué. Junto con los
# campos de `ajustes/*.toml`, cubren todas las escrituras no bloqueadas del
# catálogo de funciones (prueba `cobertura_de_escrituras`). Las acciones
# (reinicio, guardado…) no entran: son de los prestablecidos (fase 4).

# ---- Duplicados de la web básica: el ajuste usa la función de la avanzada.
# Las de IPv6 de la web básica (`te_ipv6.cmd`) no son duplicados: van con
# las de fuera de las familias, más abajo.

