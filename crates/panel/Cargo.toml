[package]
name = "panel"
version = "0.5.1"
description = "Panel web (Leptos + Axum) para gestionar el router Askey RTF8115VW"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
# cargo-leptos compila en depuración con `--cfg erase_components` (main.rs
# lo comprueba para el e2e).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(erase_components)"] }

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# Datos de las server functions (servidor y navegador).
serde.workspace = true
# Textos de la interfaz en español e inglés.
i18n = { path = "../i18n" }
# Catálogo de ajustes: los tipos en las vistas; con `ssr`, carga y validación.
ajustes = { path = "../ajustes" }
# Posición del puntero en los gráficos (`getBoundingClientRect`); ya la trae
# Leptos, aquí solo se activa `DomRect`.
web-sys = { workspace = true, features = ["DomRect", "HtmlDetailsElement", "NodeList"] }
# Servidor (feature `ssr`).
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hgu = { path = "../hgu", optional = true }
catalogo = { path = "../catalogo", optional = true }
argon2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Navegador (feature `hydrate`).
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[dev-dependencies]
router-sim = { path = "../router-sim" }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
# Registro capturado en las pruebas que comprueban lo que se anota.
tracing.workspace = true
# Nombres de la API en el HTML de las páginas de Ajustes.
regex.workspace = true
tracing-subscriber.workspace = true

[features]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:tower",
    "dep:serde_json",
    "dep:hgu",
    "dep:catalogo",
    "dep:argon2",
    "dep:sha2",
    "dep:base64",
    "dep:getrandom",
    "dep:form_urlencoded",
    "dep:rpassword",
    "dep:chacha20poly1305",
    "dep:tracing",
    "dep:tracing-subscriber",
    "i18n/tracing",
    "ajustes/catalogo",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[[example]]
name = "e2e_grupo"
required-features = ["ssr"]

# Un solo binario de integración (tests/integracion/main.rs), con un módulo
# por área: se enlaza una vez en lugar de una por fichero.
[[test]]
name = "integracion"
path = "tests/integracion/main.rs"
required-features = ["ssr"]
