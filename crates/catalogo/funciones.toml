# Catálogo de funciones del router Askey RTF8115VW (Movistar/O2).
#
# Fuente de verdad, revisada a mano. El borrador inicial lo generó
# `cargo run -p gen-catalogo -- borrador <dir_bruto> <salida>` a partir de las
# páginas y scripts capturados del router; el generador nunca escribe aquí.
# `docs/api.md` se genera de este fichero (`cargo run -p gen-catalogo -- --api-md`).
#
# Campos: ver crates/catalogo/src/model.rs. Reglas de riesgo: WAN, IP de la
# LAN, puentes, cortafuegos y TR-069 alto; WiFi, DNS y rango DHCP medio; resto
# bajo; las lecturas no tienen riesgo. En `lectura_pareada.params`, `{p}` es el
# valor del parámetro `p` de la escritura.
#
# `acceso` (obligatorio en escrituras y acciones) decide si el gestor de
# cambios vigila el cambio: `puede_cortar` (IP o máscara de la LAN, DHCP,
# cortafuegos y filtros, rutas, WAN y VLAN, QoS, IPv6 de la LAN, DNS del
# relé, reinicios, firmware y contraseñas de acceso: se vigila durante el plazo
# de su riesgo), `no_corta` (cuentas de la web, voz, TR-069, nombres, puertos,
# hora…: se da por aplicado en cuanto la relectura muestra lo nuevo) y `wifi`
# (solo corta si el panel llega al router por WiFi: se vigila salvo que el
# panel compruebe que va por cable). Ante la duda, `puede_cortar`.

