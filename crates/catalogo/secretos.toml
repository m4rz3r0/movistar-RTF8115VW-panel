# Nombres de elementos XML y parámetros cuyos valores protege el panel, en
# dos niveles. Se comparan sin distinguir mayúsculas. Lo carga
# `catalogo::mask::Mascara::load()`.
#
# - `secreto`: contraseñas, claves, PSK, PIN y tokens. En pantalla, campo
#   censurado con el ojo.
# - `sensible`: datos personales e identificadores (usuarios, números, serie,
#   GPON, servidores). En pantalla se ven en claro: quien mira es el dueño.
#
# Los dos niveles se enmascaran siempre en los registros (`tracing`), en los
# errores, en las exportaciones y capturas y en la tabla de cambios sin
# cifrar (sus valores van cifrados aparte).
#
# Un nombre es de un nivel si:
#   1. está en sus `exactos`, o
#   2. contiene alguno de sus `fragmentos` y no termina en uno de los
#      `sufijos_numericos` (ids, índices, tipos e indicadores: `wep_key1_type`,
#      `regen_key_interval`, `dpm_cfg_wifi_ssid_id`…).
# Si cuadra con los dos, manda `secreto` (`acs_password`, `gpon_password`).
# Además, al enmascarar un árbol XML, un elemento que contiene un fragmento y
# termina en un sufijo numérico se enmascara igualmente si su valor no es un
# entero (mismo criterio que `router-sim/src/sanitize.rs`).

# Terminaciones de identificadores e indicadores (valores enteros).
sufijos_numericos = ["_id", "_0i", "_idx", "index", "_type", "_hide", "_interval", "_mode", "_len"]

[secreto]
# Subcadenas.
fragmentos = [
    # Claves WiFi (WPA/WPA2 PSK, frase, claves WEP), sessionKey y similares.
    "key",
    "psk",
    "passphrase",
    # Contraseñas en general (PPP, GPON, usuarios del router, TR-069, SIP).
    "passw",
    "pwd",
    "passwd",
    "secret",
    "token",
    # WPS.
    "wps_device_pin",
    "wpspin",
]
# Nombres completos.
exactos = [
    "pin",
    "password",
    # Parámetros de la UI básica con la clave WiFi (XOR 0x1f en la URL).
    "wlwpapsk",
    "wlkey",
    # Login de la UI básica y de la avanzada.
    "loginpassword",
    "rqpasswd",
    # Variable de la UI básica con `M|S,usuario,contraseña` de PPPoE: lleva
    # la contraseña.
    "wanppp",
    "inorgpassword",
    "innewpassword",
    # RADIUS.
    "radius_secret",
    "radius_key",
]

[sensible]
fragmentos = [
    # Usuarios (PPP, del router, TR-069, SIP).
    "username",
    "user_name",
    "rquser",
    # TR-069: URL del ACS y datos de la petición de conexión.
    "acs_",
    "connectionrequest",
    # GPON y números de serie (el del router y el del ACS).
    "gpon",
    "serial",
    # VoIP: números de línea y desvíos, URI de registro y servidores SIP.
    "phone",
    "_number",
    "register_uri",
    "domain_uri",
    "_server_cfg",
    "proxy_cfg",
    # El dominio SIP lleva incrustada la cuenta SIP en las capturas.
    "user_agent_domain",
]
exactos = [
    "username",
    "loginusername",
    "rqusername",
    # Lista de usuarios a borrar (cbDeleteUser).
    "rqdellist",
    # Cuenta de DNS dinámico.
    "account",
]
