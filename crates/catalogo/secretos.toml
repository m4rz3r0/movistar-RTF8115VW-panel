# Nombres de elementos XML y parámetros cuyos valores se enmascaran siempre
# (pantalla, registros, historial de cambios). Se comparan sin distinguir
# mayúsculas. Lo carga `catalogo::mask::Mascara::load()`.
#
# Un nombre es secreto si:
#   1. está en `exactos`, o
#   2. contiene alguno de los `fragmentos` y no termina en uno de los
#      `sufijos_numericos` (ids, índices, tipos e indicadores: `wep_key1_type`,
#      `regen_key_interval`, `dpm_cfg_wifi_ssid_id`…).
# Además, al enmascarar un árbol XML, un elemento que contiene un fragmento y
# termina en un sufijo numérico se enmascara igualmente si su valor no es un
# entero (mismo criterio que `router-sim/src/sanitize.rs`).

# Subcadenas.
fragmentos = [
    # Claves WiFi (WPA/WPA2 PSK, frase, claves WEP), sessionKey y similares.
    "key",
    "psk",
    "passphrase",
    # Contraseñas y credenciales en general (PPP, GPON, usuarios, TR-069, SIP).
    "passw",
    "pwd",
    "passwd",
    "secret",
    "token",
    "username",
    "user_name",
    "rquser",
    # TR-069: URL del ACS y credenciales de connection request.
    "acs_",
    "connectionrequest",
    # GPON: contraseña y número de serie; serie del ACS.
    "gpon",
    "serial",
    # VoIP: números de línea, desvíos, URI de registro y servidores SIP.
    "phone",
    "_number",
    "register_uri",
    "domain_uri",
    "_server_cfg",
    "proxy_cfg",
    # WPS.
    "wps_device_pin",
    # El dominio SIP lleva incrustada la cuenta SIP en las capturas.
    "user_agent_domain",
    "wpspin",
]

# Nombres completos.
exactos = [
    "pin",
    "password",
    "username",
    # Parámetros de la UI básica con la clave WiFi (XOR 0x1f en la URL).
    "wlwpapsk",
    "wlkey",
    # Login de la UI básica y de la avanzada.
    "loginusername",
    "loginpassword",
    "rqusername",
    # Lista de usuarios a borrar (cbDeleteUser).
    "rqdellist",
    # Cuenta de DNS dinámico.
    "account",
    # Variable de la UI básica con `M|S,usuario,contraseña` de PPPoE.
    "wanppp",
    "rqpasswd",
    "inorgpassword",
    "innewpassword",
    # RADIUS.
    "radius_secret",
    "radius_key",
]

# Terminaciones de identificadores e indicadores (valores enteros).
sufijos_numericos = ["_id", "_0i", "_idx", "index", "_type", "_hide", "_interval", "_mode", "_len"]
