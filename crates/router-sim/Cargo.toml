[package]
name = "router-sim"
version = "1.0.1"
description = "Router Askey RTF8115VW simulado para pruebas y desarrollo"
default-run = "router-sim"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
hgu = { path = "../hgu" }
catalogo = { path = "../catalogo" }
axum.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
roxmltree.workspace = true
# Respuestas en crudo (301 del cortafuegos, descarga de la copia).
reqwest.workspace = true
# Las lecturas del catálogo de ajustes se prueban contra el sim.
ajustes = { path = "../ajustes", features = ["catalogo"] }
